<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bocaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <linearGradient id="riverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="#0c0c10"/>
  <rect width="640" height="360" fill="url(#bgGlow)"/>

  <!-- Tactical Grid Lines -->
  <path d="M0 60h640M0 120h640M0 180h640M0 240h640M0 300h640" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M128 0v360M256 0v360M384 0v360M512 0v360" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- HUD Corner Accents -->
  <path d="M20 35v-15h15M620 35v-15h-15M20 325v15h15M620 325v15h-15" stroke="#ef4444" stroke-width="2"/>

  <!-- Boca Side Shield -->
  <g transform="translate(140, 110)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="#0f172a" stroke="#1d4ed8" stroke-width="2"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#eab308" text-anchor="middle">CABJ</text>
  </g>

  <!-- VS Badge in center -->
  <g transform="translate(320, 110)">
    <circle cx="0" cy="0" r="26" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="6" font-family="monospace" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">VS</text>
  </g>

  <!-- River Side Shield -->
  <g transform="translate(500, 110)">
    <rect x="-45" y="-45" width="90" height="90" rx="20" fill="#18181b" stroke="#dc2626" stroke-width="2"/>
    <path d="M-30 30L30 -30" stroke="#dc2626" stroke-width="12" stroke-linecap="round"/>
    <text x="0" y="8" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">CARP</text>
  </g>

  <!-- Match Titles -->
  <text x="320" y="215" font-family="system-ui, sans-serif" font-size="24" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">BOCA JUNIORS vs RIVER PLATE</text>
  <text x="320" y="248" font-family="monospace" font-size="13" font-weight="bold" fill="#ef4444" text-anchor="middle" letter-spacing="2">SUPERCLÁSICO ARGENTINO // FINAL</text>

  <!-- Bottom Badges -->
  <rect x="220" y="280" width="200" height="28" rx="6" fill="#18181b" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="236" cy="294" r="4" fill="#ef4444"/>
  <text x="325" y="299" font-family="monospace" font-size="10" font-weight="bold" fill="#d4d4d8" text-anchor="middle">TRANSMISIÓN EN VIVO</text>
</svg>
